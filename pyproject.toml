[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vip-girls"
version = "0.1.0"
description = "Temporal argument graphs, hierarchical agent simulation, and argument-risk monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6",
    "ruff>=0.8",
]

[project.scripts]
vip-girls = "demo:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["demo"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "pipeline*", "society*", "hierarchy*"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
